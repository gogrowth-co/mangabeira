# Auto-deploys edge functions on push to main when supabase/functions/** changes.
# Requires repo secret: SUPABASE_ACCESS_TOKEN
name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
      - master
    paths:
      - "supabase/functions/**"
  workflow_dispatch:
    inputs:
      function:
        description: "Function name to deploy (leave blank to deploy all)"
        required: false
        default: ""

concurrency:
  group: deploy-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy changed functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          PROJECT_REF="hetemmltaoirimmoxzku"

          if [ -n "${{ github.event.inputs.function }}" ]; then
            echo "Deploying single function: ${{ github.event.inputs.function }}"
            supabase functions deploy ${{ github.event.inputs.function }} \
              --project-ref "$PROJECT_REF" \
              --no-verify-jwt
          else
            echo "Deploying all functions in supabase/functions/"
            for fn_dir in supabase/functions/*/; do
              fn_name=$(basename "$fn_dir")
              echo "→ Deploying $fn_name"
              supabase functions deploy "$fn_name" \
                --project-ref "$PROJECT_REF" \
                --no-verify-jwt || echo "WARNING: $fn_name deploy failed"
            done
          fi
