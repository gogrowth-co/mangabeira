name: Edge functions changed — notify (Lovable Cloud manual deploy required)

# This Supabase project (hetemmltaoirimmoxzku) is managed by Lovable Cloud.
# Personal access tokens (sbp_*) from https://supabase.com/dashboard/account/tokens
# return HTTP 403 on `supabase functions deploy` against this project — verified
# 2026-05-25 with token belonging to gogrowth2024@gmail.com / gogrowth-co's Org.
# Lovable Cloud's own deploy mechanism is the only path that works here.
#
# This workflow does NOT attempt to deploy. It only notifies that edge function
# code changed and a Lovable-side deploy is needed.

on:
  push:
    branches: [main, master]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

jobs:
  notify:
    name: Notify edge function change
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: List changed edge functions and emit deploy notice
        run: |
          echo "::group::Changed files under supabase/functions/"
          CHANGED=$(git diff --name-only HEAD^ HEAD -- 'supabase/functions/**' 2>/dev/null || echo "")
          if [ -z "$CHANGED" ]; then
            echo "No changes detected (manual dispatch or first commit)."
          else
            echo "$CHANGED"
          fi
          echo "::endgroup::"

          FUNCTIONS=$(echo "$CHANGED" | awk -F'/' '/^supabase\/functions\//{print $3}' | sort -u | grep -v '^$' || true)

          {
            echo "## Edge functions changed"
            echo ""
            if [ -n "$FUNCTIONS" ]; then
              for fn in $FUNCTIONS; do echo "- \`$fn\`"; done
            else
              echo "_(no specific function detected from diff)_"
            fi
            echo ""
            echo "## Deploy required"
            echo ""
            echo "This project is Lovable Cloud-managed. Personal Supabase access tokens cannot deploy here."
            echo ""
            echo "Open https://lovable.dev/projects/0a284096-9804-4f63-a8a0-00f3274dbacd → Cloud → Edge functions and trigger a deploy, or ask Lovable AI to pull the latest commit and deploy the changed function(s)."
            echo ""
            echo "See \`DEPLOY.md\` in the repo root for the full constraint."
          } >> $GITHUB_STEP_SUMMARY
