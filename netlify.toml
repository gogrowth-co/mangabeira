[build]
  publish = "dist"
  command = "npm run build"

[build.processing]
  skip_processing = true

# Force correct Content-Type headers for SEO files
# netlify.toml headers override Netlify defaults
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
