[build]
  publish = "dist"
  command = "npm run build"

# Serve static SEO files with proper headers
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=0, must-revalidate, no-cache"

[[headers]]
  for = "/*.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=0, must-revalidate"
