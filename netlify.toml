[build]
  publish = "dist"
  command = "npm run build"

[build.processing]
  skip_processing = true

# Serve static SEO files with proper headers
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate, no-cache, no-store, no-transform"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate, no-transform"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=0, must-revalidate"
