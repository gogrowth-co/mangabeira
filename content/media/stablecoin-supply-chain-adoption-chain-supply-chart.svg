<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><rect width="1200" height="675" fill="#fff"/><style>.t{font:700 40px Montserrat,Arial,sans-serif;fill:#0A2540}.h{font:700 30px Montserrat,Arial,sans-serif;fill:#0A2540}.b{font:400 24px Inter,Arial,sans-serif;fill:#17324A}.s{font:400 22px Inter,Arial,sans-serif;fill:#425466}</style><text x="72" y="80" class="t"><tspan x="72" dy="0">Supply is not proof of product use</tspan></text><rect x="72" y="160" width="240" height="385" rx="8" fill="#F3F7FA"/><rect x="72" y="160" width="240" height="88" rx="8" fill="#0A2540"/><text x="86" y="208" style="font:700 30px Montserrat,Arial,sans-serif;fill:#fff"><tspan x="86" dy="0">Supply</tspan></text><text x="86" y="300" class="h"><tspan x="86" dy="0">USD estimate</tspan></text><text x="86" y="355" class="b"><tspan x="86" dy="0">Circulating</tspan><tspan x="86" dy="40">balances mapped</tspan><tspan x="86" dy="40">by chain</tspan></text><text x="86" y="470" class="s"><tspan x="86" dy="0">Cannot identify</tspan><tspan x="86" dy="40">users or actions</tspan></text><rect x="344" y="160" width="240" height="385" rx="8" fill="#F3F7FA"/><rect x="344" y="160" width="240" height="88" rx="8" fill="#0A2540"/><text x="360" y="208" style="font:700 30px Montserrat,Arial,sans-serif;fill:#fff"><tspan x="360" dy="0">Issuer</tspan></text><text x="360" y="300" class="h"><tspan x="360" dy="0">Asset and</tspan><tspan x="360" dy="40">chain</tspan></text><text x="360" y="390" class="b"><tspan x="360" dy="0">Named product</tspan><tspan x="360" dy="40">and API operation</tspan></text><text x="360" y="490" class="s"><tspan x="360" dy="0">Token listing does</tspan><tspan x="360" dy="32">not prove API support</tspan></text><rect x="616" y="160" width="240" height="385" rx="8" fill="#F3F7FA"/><rect x="616" y="160" width="240" height="88" rx="8" fill="#FFB800"/><text x="632" y="208" style="font:700 30px Montserrat,Arial,sans-serif;fill:#0A2540"><tspan x="632" dy="0">Product use</tspan></text><text x="632" y="300" class="h"><tspan x="632" dy="0">Defined event</tspan></text><text x="632" y="355" class="b"><tspan x="632" dy="0">Unit, denominator</tspan><tspan x="632" dy="40">and observation</tspan><tspan x="632" dy="40">period</tspan></text><text x="632" y="470" class="s"><tspan x="632" dy="0">Does not prove</tspan><tspan x="632" dy="40">cause without a</tspan><tspan x="632" dy="40">test design</tspan></text><rect x="888" y="160" width="240" height="385" rx="8" fill="#F3F7FA"/><rect x="888" y="160" width="240" height="88" rx="8" fill="#0A2540"/><text x="904" y="208" style="font:700 30px Montserrat,Arial,sans-serif;fill:#fff"><tspan x="904" dy="0">Redemption</tspan></text><text x="904" y="300" class="h"><tspan x="904" dy="0">Documented</tspan></text><text x="904" y="355" class="b"><tspan x="904" dy="0">Mint, deposit,</tspan><tspan x="904" dy="40">payout or redeem</tspan></text><text x="904" y="470" class="s"><tspan x="904" dy="0">Check product</tspan><tspan x="904" dy="40">and restrictions</tspan></text><text x="72" y="635" class="s"><tspan x="72" dy="0">Evidence map from DefiLlama definitions and Circle documentation. No numeric adoption score.</tspan></text></svg>