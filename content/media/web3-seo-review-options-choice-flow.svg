<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Choose by evidence and owner</title><desc id="desc">A four-step decision sequence: name the decision, locate the evidence gap, assign an owner and verify the finding.</desc><rect width="1200" height="675" fill="#ffffff"/><rect x="0" y="0" width="1200" height="40" fill="#1FB6FF"/><text x="72" y="112" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="700" fill="#0A2540" text-anchor="start">Choose by evidence and owner</text><text x="72" y="160" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="400" fill="#314b61" text-anchor="start">Four checks</text><rect x="72" y="224" width="240" height="248" rx="12" fill="#f1f5f8" stroke="#c5d3dc" stroke-width="2"/><text x="96" y="280" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#314b61" text-anchor="start">01</text><text x="96" y="336" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#0A2540" text-anchor="start">Name the</text><text x="96" y="372" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#0A2540" text-anchor="start">decision</text><path d="M320 328h16" stroke="#0A2540" stroke-width="4"/><path d="m328 320 8 8-8 8" fill="none" stroke="#0A2540" stroke-width="4"/><rect x="344" y="224" width="240" height="248" rx="12" fill="#f1f5f8" stroke="#c5d3dc" stroke-width="2"/><text x="368" y="280" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#314b61" text-anchor="start">02</text><text x="368" y="336" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#0A2540" text-anchor="start">Find the</text><text x="368" y="372" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#0A2540" text-anchor="start">evidence gap</text><path d="M592 328h16" stroke="#0A2540" stroke-width="4"/><path d="m600 320 8 8-8 8" fill="none" stroke="#0A2540" stroke-width="4"/><rect x="616" y="224" width="240" height="248" rx="12" fill="#f1f5f8" stroke="#c5d3dc" stroke-width="2"/><text x="640" y="280" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#314b61" text-anchor="start">03</text><text x="640" y="336" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#0A2540" text-anchor="start">Assign an</text><text x="640" y="372" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#0A2540" text-anchor="start">owner</text><path d="M864 328h16" stroke="#0A2540" stroke-width="4"/><path d="m872 320 8 8-8 8" fill="none" stroke="#0A2540" stroke-width="4"/><rect x="888" y="224" width="240" height="248" rx="12" fill="#0A2540" stroke="#c5d3dc" stroke-width="2"/><text x="912" y="280" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start">04</text><text x="912" y="336" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#ffffff" text-anchor="start">Verify the</text><text x="912" y="372" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#ffffff" text-anchor="start">finding</text><text x="72" y="520" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#0A2540" text-anchor="start">Keep the URL, evidence and owner.</text><text x="72" y="576" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" fill="#314b61" text-anchor="start">Source: Google Search Central.</text></svg>
