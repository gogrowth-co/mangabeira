<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Measure the path from a public raise to product behavior</title>
<desc id="desc">A four-step framework: public raise, investor activation, product use, and repeat activity.</desc>
<rect width="1200" height="675" fill="#F5F8FB"/>
<text x="70" y="96" font-family="Inter,Arial,sans-serif" font-size="39" font-weight="700" fill="#0A2540">Measure the path from raise to product behavior</text>
<g fill="#FFFFFF" stroke="#1FB6FF" stroke-width="4">
<rect x="50" y="220" width="235" height="150" rx="18"/><rect x="335" y="220" width="235" height="150" rx="18"/><rect x="620" y="220" width="235" height="150" rx="18"/><rect x="905" y="220" width="235" height="150" rx="18"/>
</g>
<g stroke="#1FB6FF" stroke-width="8" fill="#1FB6FF"><path d="M290 295 L323 295"/><path d="M575 295 L608 295"/><path d="M860 295 L893 295"/></g>
<g font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="middle">
<text x="167" y="304">Public raise</text><text x="452" y="304">Investor activation</text><text x="737" y="304">Product use</text><text x="1022" y="304">Repeat activity</text>
</g>
<text x="70" y="456" font-family="Inter,Arial,sans-serif" font-size="29" fill="#31516B">Define the event, cohort and time window before drawing a causal conclusion.</text>
<text x="70" y="560" font-family="Inter,Arial,sans-serif" font-size="22" fill="#526779">This is a measurement framework, not a claim that each step occurred.</text>
</svg>
