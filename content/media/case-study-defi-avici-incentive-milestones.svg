<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">AVICI-001 conditional team performance milestones</title>
<desc id="desc">Three conditional proposal targets: 1.5 percent cumulative at 5.41 dollars, 15 percent at 43.59 dollars, and up to 25 percent at 151.75 dollars.</desc>
<rect width="1200" height="675" fill="#FFFFFF"/>
<text x="64" y="72" font-family="Inter,Arial,sans-serif" font-size="39" font-weight="700" fill="#0A2540">AVICI-001: conditional team incentive milestones</text>
<text x="64" y="120" font-family="Inter,Arial,sans-serif" font-size="29" fill="#334155">Proposal terms only. Targets use a 60-day TWAP.</text>
<text x="64" y="184" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#0A2540">AVICI price target</text>
<text x="596" y="184" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#0A2540">Cumulative potential allocation</text>
<g font-family="Inter,Arial,sans-serif" fill="#334155" font-size="29">
<text x="64" y="278">$5.41</text><text x="64" y="374">$43.59</text><text x="64" y="470">$151.75</text>
</g>
<g fill="#E7EEF4"><rect x="596" y="224" width="480" height="56" rx="12"/><rect x="596" y="320" width="480" height="56" rx="12"/><rect x="596" y="416" width="480" height="56" rx="12"/></g>
<g fill="#1FB6FF"><rect x="596" y="224" width="29" height="56" rx="12"/><rect x="596" y="320" width="288" height="56" rx="12"/><rect x="596" y="416" width="480" height="56" rx="12"/></g>
<g font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#0A2540">
<text x="1090" y="262">1.5%</text><text x="900" y="358">15%</text><text x="900" y="454">25% maximum</text>
</g>
<line x1="64" y1="520" x2="1136" y2="520" stroke="#CBD5E1" stroke-width="2"/>
<text x="64" y="560" font-family="Inter,Arial,sans-serif" font-size="22" fill="#0A2540">The proposal states up to 8.24 million AVICI at the 25% maximum.</text>
<text x="64" y="592" font-family="Inter,Arial,sans-serif" font-size="22" fill="#334155">Conditional targets, not current prices or proof that milestones were reached.</text>
<text x="64" y="624" font-family="Inter,Arial,sans-serif" font-size="22" fill="#526779">Source: MetaDAO AVICI-001, created March 30, 2026. Checked November 2, 2026.</text>
