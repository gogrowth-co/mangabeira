<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><text x="64" y="96" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#0A2540">Public evidence has limits</text><rect x="0" y="176" width="1200" height="36" fill="#007AB2"/><text x="64" y="136" font-family="Arial,sans-serif" font-size="29" fill="#163B56">Signals do not prove causes</text><rect x="64" y="240" width="328" height="230" fill="#F2F7FA" stroke="#0A2540" stroke-width="2"/><text x="88" y="304" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#0A2540">Public signals</text><text x="88" y="336" font-family="Arial,sans-serif" font-size="22" fill="#163B56"><tspan x="88">Docs, governance,</tspan><tspan x="88" dy="32">protocol activity</tspan></text><text x="400" y="344" font-family="Arial,sans-serif" font-size="29" fill="#0A2540">›</text><rect x="432" y="240" width="328" height="230" fill="#F2F7FA" stroke="#0A2540" stroke-width="2"/><text x="458" y="304" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#0A2540">Can support</text><text x="458" y="336" font-family="Arial,sans-serif" font-size="22" fill="#163B56"><tspan x="458">Product scope and</tspan><tspan x="458" dy="32">bounded activity</tspan></text><text x="768" y="344" font-family="Arial,sans-serif" font-size="29" fill="#0A2540">›</text><rect x="800" y="240" width="328" height="230" fill="#F2F7FA" stroke="#0A2540" stroke-width="2"/><text x="828" y="304" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#0A2540">Still unknown</text><text x="828" y="336" font-family="Arial,sans-serif" font-size="22" fill="#163B56"><tspan x="828">Attribution, person-level</tspan><tspan x="828" dy="32">retention, causal ROI</tspan></text><text x="64" y="608" font-family="Arial,sans-serif" font-size="22" fill="#425466">Analyst in the Arena | Evidence coverage, not performance</text></svg>