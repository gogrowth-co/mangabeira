<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">DeFi marketing measurement chain</title><desc id="desc">Three connected steps: campaign acquisition, cohort retention, and cost per activated wallet. Protocol health metrics provide context.</desc><rect width="1200" height="540" rx="24" fill="#f7fafc"/><text x="60" y="72" font-family="Inter,Arial" font-size="30" font-weight="700" fill="#0A2540">A defensible marketing measurement chain</text><g font-family="Inter,Arial" text-anchor="middle"><rect x="65" y="150" width="300" height="230" rx="20" fill="#fff" stroke="#0A2540" stroke-width="3"/><circle cx="215" cy="220" r="28" fill="#FFB800"/><text x="215" y="285" font-size="27" font-weight="700" fill="#0A2540">Acquisition</text><text x="215" y="328" font-size="19" fill="#334155">Attributed activated wallets</text><path d="M380 265h110" stroke="#FFB800" stroke-width="9"/><path d="m480 245 28 20-28 20" fill="none" stroke="#FFB800" stroke-width="9"/><rect x="505" y="150" width="300" height="230" rx="20" fill="#fff" stroke="#0A2540" stroke-width="3"/><circle cx="655" cy="220" r="28" fill="#FFB800"/><text x="655" y="285" font-size="27" font-weight="700" fill="#0A2540">Retention</text><text x="655" y="328" font-size="19" fill="#334155">Same cohort, stated window</text><path d="M820 265h110" stroke="#FFB800" stroke-width="9"/><path d="m920 245 28 20-28 20" fill="none" stroke="#FFB800" stroke-width="9"/><rect x="945" y="150" width="200" height="230" rx="20" fill="#fff" stroke="#0A2540" stroke-width="3"/><circle cx="1045" cy="220" r="28" fill="#FFB800"/><text x="1045" y="285" font-size="27" font-weight="700" fill="#0A2540">Cost</text><text x="1045" y="328" font-size="18" fill="#334155">Spend ÷ activations</text><text x="600" y="460" font-size="20" fill="#475569">TVL and protocol-wide activity sit beside this chain as context, not proof of campaign causation.</text></g></svg>
