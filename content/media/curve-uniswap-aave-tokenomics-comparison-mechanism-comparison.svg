<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><rect width="1200" height="675" fill="#fff"/><style>.t{font:700 52px Montserrat,Arial,sans-serif;fill:#0A2540}.h{font:700 39px Montserrat,Arial,sans-serif;fill:#0A2540}.b{font:400 29px Inter,Arial,sans-serif;fill:#17324A}.s{font:400 22px Inter,Arial,sans-serif;fill:#425466}</style><text x="72" y="80" class="t"><tspan x="72" dy="0">Compare four operating dimensions</tspan></text><rect x="72" y="192" width="240" height="320" rx="8" fill="#F3F7FA"/><rect x="72" y="192" width="240" height="80" rx="8" fill="#0A2540"/><text x="90" y="248" style="font:700 39px Montserrat,Arial,sans-serif;fill:#fff">Control</text><text x="90" y="344" class="b"><tspan x="90" dy="0">Who can change</tspan><tspan x="90" dy="40">or approve?</tspan></text><rect x="344" y="192" width="240" height="320" rx="8" fill="#F3F7FA"/><rect x="344" y="192" width="240" height="80" rx="8" fill="#0A2540"/><text x="360" y="248" style="font:700 39px Montserrat,Arial,sans-serif;fill:#fff">Trigger</text><text x="360" y="344" class="b"><tspan x="360" dy="0">What event</tspan><tspan x="360" dy="40">starts flow?</tspan></text><rect x="616" y="192" width="240" height="320" rx="8" fill="#F3F7FA"/><rect x="616" y="192" width="240" height="80" rx="8" fill="#0A2540"/><text x="632" y="248" style="font:700 39px Montserrat,Arial,sans-serif;fill:#fff">Recipient</text><text x="632" y="344" class="b"><tspan x="632" dy="0">Who receives</tspan><tspan x="632" dy="40">value?</tspan></text><rect x="888" y="192" width="240" height="320" rx="8" fill="#F3F7FA"/><rect x="888" y="192" width="240" height="80" rx="8" fill="#0A2540"/><text x="904" y="248" style="font:700 39px Montserrat,Arial,sans-serif;fill:#fff">Required</text><text x="904" y="344" class="b"><tspan x="904" dy="0">What must</tspan><tspan x="904" dy="40">stay active?</tspan></text><text x="72" y="608" class="s"><tspan x="72" dy="0">Qualitative comparison. No performance scores or growth-causality claims.</tspan></text></svg>