<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f5f8fb"/><text x="70" y="95" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0A2540">Meça da captação ao uso do produto</text><rect x="50" y="220" width="235" height="150" rx="18" fill="#fff" stroke="#1FB6FF" stroke-width="3"/><text x="167" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0A2540">Captação pública</text><path d="M290 295 L323 295" stroke="#FFB800" stroke-width="7" marker-end="url(#arrow)"/><rect x="335" y="220" width="235" height="150" rx="18" fill="#fff" stroke="#1FB6FF" stroke-width="3"/><text x="452" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0A2540">Ativação</text><path d="M575 295 L608 295" stroke="#FFB800" stroke-width="7" marker-end="url(#arrow)"/><rect x="620" y="220" width="235" height="150" rx="18" fill="#fff" stroke="#1FB6FF" stroke-width="3"/><text x="737" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0A2540">Uso e recomendação</text><path d="M860 295 L893 295" stroke="#FFB800" stroke-width="7" marker-end="url(#arrow)"/><rect x="905" y="220" width="235" height="150" rx="18" fill="#fff" stroke="#1FB6FF" stroke-width="3"/><text x="1022" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0A2540">Recorrência</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#FFB800"/></marker></defs><text x="70" y="475" font-family="Arial,sans-serif" font-size="23" fill="#31516b">Defina o evento, a coorte e o período antes de concluir causalidade.</text><text x="70" y="625" font-family="Arial,sans-serif" font-size="18" fill="#526779">Estrutura de medição, não afirmação de que cada etapa ocorreu.</text></svg>