<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><text x="64" y="96" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#0A2540">Build decision measures</text><rect x="0" y="176" width="1200" height="36" fill="#007AB2"/><text x="64" y="136" font-family="Arial,sans-serif" font-size="29" fill="#163B56">Four steps to growth targets</text><rect x="64" y="240" width="248" height="240" fill="#F2F7FA" stroke="#0A2540" stroke-width="2"/><text x="80" y="312" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540">1. Define events</text><text x="80" y="344" font-family="Arial,sans-serif" font-size="22" fill="#163B56"><tspan x="80">Name the event</tspan><tspan x="80" dy="32">and denominator</tspan></text><text x="320" y="344" font-family="Arial,sans-serif" font-size="29" fill="#0A2540">›</text><rect x="344" y="240" width="248" height="240" fill="#F2F7FA" stroke="#0A2540" stroke-width="2"/><text x="360" y="312" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540">2. Set the unit</text><text x="360" y="344" font-family="Arial,sans-serif" font-size="22" fill="#163B56"><tspan x="360">Separate sessions,</tspan><tspan x="360" dy="32">wallets, people</tspan></text><text x="600" y="344" font-family="Arial,sans-serif" font-size="29" fill="#0A2540">›</text><rect x="624" y="240" width="248" height="240" fill="#F2F7FA" stroke="#0A2540" stroke-width="2"/><text x="640" y="312" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540">3. Join permitted data</text><text x="640" y="344" font-family="Arial,sans-serif" font-size="22" fill="#163B56"><tspan x="640">Respect identity</tspan><tspan x="640" dy="32">and privacy limits</tspan></text><text x="880" y="344" font-family="Arial,sans-serif" font-size="29" fill="#0A2540">›</text><rect x="904" y="240" width="248" height="240" fill="#F2F7FA" stroke="#0A2540" stroke-width="2"/><text x="920" y="312" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540">4. Test one question</text><text x="920" y="344" font-family="Arial,sans-serif" font-size="22" fill="#163B56"><tspan x="920">Use a defensible</tspan><tspan x="920" dy="32">comparison</tspan></text><text x="64" y="608" font-family="Arial,sans-serif" font-size="22" fill="#425466">Analyst in the Arena | Evidence coverage, not performance</text></svg>