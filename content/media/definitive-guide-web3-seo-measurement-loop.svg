<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"><rect width="1200" height="700" fill="#fff"/><text x="55" y="65" font-family="Arial" font-size="34" fill="#0A2540">SEO measurement loop</text><rect x="60" y="230" width="252" height="235" rx="20" fill="#f4f8fb" stroke="#0A2540" stroke-width="3"/><text x="186" y="295" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#0A2540">Observe</text><text x="186" y="350" text-anchor="middle" font-family="Arial" font-size="20" fill="#333">Queries</text><text x="186" y="388" text-anchor="middle" font-family="Arial" font-size="20" fill="#333">Pages</text><rect x="336" y="230" width="252" height="235" rx="20" fill="#f4f8fb" stroke="#0A2540" stroke-width="3"/><text x="462" y="295" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#0A2540">Diagnose</text><text x="462" y="350" text-anchor="middle" font-family="Arial" font-size="20" fill="#333">Access</text><text x="462" y="388" text-anchor="middle" font-family="Arial" font-size="20" fill="#333">Intent</text><rect x="612" y="230" width="252" height="235" rx="20" fill="#f4f8fb" stroke="#0A2540" stroke-width="3"/><text x="738" y="295" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#0A2540">Change</text><text x="738" y="350" text-anchor="middle" font-family="Arial" font-size="20" fill="#333">One page</text><text x="738" y="388" text-anchor="middle" font-family="Arial" font-size="20" fill="#333">One issue</text><rect x="888" y="230" width="252" height="235" rx="20" fill="#f4f8fb" stroke="#0A2540" stroke-width="3"/><text x="1014" y="295" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#0A2540">Review</text><text x="1014" y="350" text-anchor="middle" font-family="Arial" font-size="20" fill="#333">Measure again</text><text x="1014" y="388" text-anchor="middle" font-family="Arial" font-size="20" fill="#333">Avoid causal claims</text><text x="600" y="5