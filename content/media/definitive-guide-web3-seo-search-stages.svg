<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#fff"/><text x="55" y="70" font-family="Arial" font-size="34" fill="#0A2540">Google Search: three documented stages</text><path d="M180 380H1020" stroke="#0A2540" stroke-width="8"/><g font-family="Arial" text-anchor="middle"><circle cx="220" cy="380" r="70" fill="#0A2540"/><text x="220" y="390" fill="#fff" font-size="24">Crawl</text><circle cx="600" cy="380" r="70" fill="#0A2540"/><text x="600" y="390" fill="#fff" font-size="24">Index</text><circle cx="980" cy="380" r="70" fill="#0A2540"/><text x="980" y="390" fill="#fff" font-size="24">Serve</text><text x="220" y="510" fill="#333" font-size="20">Fetch accessible URLs</text><text x="600" y="510" fill="#333" font-size="20">Analyze and store</text><text x="980" y="510" fill="#333" font-size="20">Select relevant results</text></g><text x="55" y="650" font-family="Arial" font-size="18" fill="#555">Not every page passes through every stage. Source: Google Search Central.</text></svg>