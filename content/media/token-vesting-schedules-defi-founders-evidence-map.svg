<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><text x="64" y="78" font-family="Inter,Arial" font-size="52" font-weight="700" fill="#0A2540">Four records, four questions</text><text x="64" y="122" font-family="Inter,Arial" font-size="39" fill="#354a5f">Keep stages distinct.</text><g font-family="Inter,Arial" fill="#0A2540"><rect x="70" y="215" width="245" height="210" rx="12" fill="#f3f8fc" stroke="#0A2540" stroke-width="3"/><rect x="355" y="215" width="245" height="210" rx="12" fill="#f3f8fc" stroke="#0A2540" stroke-width="3"/><rect x="640" y="215" width="245" height="210" rx="12" fill="#FFB800" stroke="#0A2540" stroke-width="4"/><rect x="925" y="215" width="205" height="210" rx="12" fill="#f3f8fc" stroke="#0A2540" stroke-width="3"/><text x="192" y="280" text-anchor="middle" font-size="29" font-weight="700">Issuer terms</text><text x="192" y="330" text-anchor="middle" font-size="22">What is scheduled?</text><text x="477" y="280" text-anchor="middle" font-size="29" font-weight="700">Contract event</text><text x="477" y="330" text-anchor="middle" font-size="22">What was released?</text><text x="762" y="280" text-anchor="middle" font-size="29" font-weight="700">Token transfer</text><text x="762" y="330" text-anchor="middle" font-size="22">Where did it move?</text><text x="1027" y="280" text-anchor="middle" font-size="29" font-weight="700">Supply basis</text><text x="1027" y="330" text-anchor="middle" font-size="22">How is it counted?</text></g><g stroke="#0A2540" stroke-width="4" fill="#0A2540"><path d="M317 320h30"/><path d="M600 320h30"/><path d="M885 320h30"/></g><text x="70" y="540" font-family="Inter,Arial" font-size="22" fill="#354a5f">An evidence workflow only. No token quantity or sale is inferred.</text><text x="70" y="625" font-family="Inter,Arial" font-size="22" fill="#354a5f">Sources: Arbitrum DAO; Ethereum ERC-20.</text></svg>
