<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">MetaDAO's reported Avici weekly active user figures</title><desc id="desc">About 1,000 weekly active users before raising and about 10,000 after raising, as reported by MetaDAO. Dates and metric definition are not provided.</desc><rect width="1200" height="675" fill="#fff"/><text x="80" y="82" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#0A2540">MetaDAO-reported Avici weekly active users</text><text x="80" y="128" font-family="Inter,Arial,sans-serif" font-size="22" fill="#45576b">Approximate figures in MetaDAO's current company description</text><line x1="230" y1="530" x2="1050" y2="530" stroke="#0A2540" stroke-width="3"/><rect x="340" y="450" width="190" height="80" rx="8" fill="#1FB6FF"/><rect x="740" y="170" width="190" height="360" rx="8" fill="#FFB800"/><text x="435" y="430" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700" fill="#0A2540">~1,000</text><text x="835" y="148" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700" fill="#0A2540">~10,000</text><text x="435" y="575" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="24" fill="#0A2540">Before the raise</text><text x="835" y="575" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="24" fill="#0A2540">After the raise</text><text x="80" y="625" font-family="Inter,Arial,sans-serif" font-size="18" fill="#45576b">Source: MetaDAO, metadao.fi, checked Oct 16, 2026. Dates and WAU definition not stated. Not causal proof.</text></svg>
