<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Match the review to the work</title><desc id="desc">Comparison of a self-serve tool, agency audit and independent analyst review by evidence and implementation ownership.</desc><rect width="1200" height="675" fill="#ffffff"/><rect x="0" y="0" width="1200" height="40" fill="#1FB6FF"/><text x="64" y="112" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="700" fill="#0A2540" text-anchor="start">Match the review to the work</text><text x="64" y="160" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="400" fill="#314b61" text-anchor="start">Use evidence and ownership to compare</text><rect x="64" y="208" width="336" height="304" rx="12" fill="#f1f5f8" stroke="#c5d3dc" stroke-width="2"/><text x="88" y="254" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="start">TOOL</text><text x="88" y="352" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="400" fill="#0A2540" text-anchor="start">Runs defined checks</text><text x="88" y="424" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="400" fill="#314b61" text-anchor="start">Your team acts</text><path d="M88 312h288" stroke="#c5d3dc" stroke-width="2"/><rect x="432" y="208" width="336" height="304" rx="12" fill="#f1f5f8" stroke="#c5d3dc" stroke-width="2"/><rect x="432" y="208" width="336" height="72" rx="12" fill="#0A2540"/><text x="456" y="254" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start">AGENCY</text><text x="456" y="352" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="400" fill="#0A2540" text-anchor="start">Scoped tasks</text><text x="456" y="424" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="400" fill="#314b61" text-anchor="start">Owner in contract</text><path d="M456 312h288" stroke="#c5d3dc" stroke-width="2"/><rect x="800" y="208" width="336" height="304" rx="12" fill="#f1f5f8" stroke="#c5d3dc" stroke-width="2"/><text x="824" y="254" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#0A2540" text-anchor="start">ANALYST</text><text x="824" y="352" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="400" fill="#0A2540" text-anchor="start">Outside diagnosis</text><text x="824" y="424" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="400" fill="#314b61" text-anchor="start">Team implements</text><path d="M824 312h288" stroke="#c5d3dc" stroke-width="2"/><text x="64" y="584" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" fill="#314b61" text-anchor="start">Google Search Central documents tests, not contracted</text><text x="64" y="615" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" fill="#314b61" text-anchor="start">implementation.</text></svg>
