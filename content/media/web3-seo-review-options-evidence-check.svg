<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Search has three stages</title><desc id="desc">Three evidence checks for crawling, rendered content and indexing status, with a relevant follow-up for each.</desc><rect width="1200" height="675" fill="#ffffff"/><rect x="0" y="0" width="1200" height="40" fill="#1FB6FF"/><text x="72" y="112" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="700" fill="#0A2540" text-anchor="start">Search has three stages</text><rect x="72" y="208" width="336" height="64" fill="#0A2540"/><text x="92" y="250" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start">STAGE</text><rect x="408" y="208" width="360" height="64" fill="#0A2540"/><text x="428" y="250" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start">ASK</text><rect x="768" y="208" width="360" height="64" fill="#0A2540"/><text x="788" y="250" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start">CHECK</text><rect x="72" y="272" width="1056" height="92" fill="#f1f5f8" stroke="#c5d3dc" stroke-width="1"/><text x="92" y="312" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#0A2540" text-anchor="start">CRAWLING</text><text x="428" y="304" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="400" fill="#0A2540" text-anchor="start">Can Google</text><text x="428" y="340" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="400" fill="#0A2540" text-anchor="start">fetch URL?</text><text x="788" y="304" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="400" fill="#0A2540" text-anchor="start">Check URL</text><text x="788" y="340" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="400" fill="#0A2540" text-anchor="start">response.</text><rect x="72" y="360" width="1056" height="92" fill="#ffffff" stroke="#c5d3dc" stroke-width="1"/><text x="92" y="400" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#0A2540" text-anchor="start">RENDERING</text><text x="428" y="392" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="400" fill="#0A2540" text-anchor="start">Does content</text><text x="428" y="428" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="400" fill="#0A2540" text-anchor="start">appear in HTML?</text><text x="788" y="392" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="400" fill="#0A2540" text-anchor="start">Inspect one</text><text x="788" y="428" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="400" fill="#0A2540" text-anchor="start">URL.</text><rect x="72" y="448" width="1056" height="92" fill="#f1f5f8" stroke="#c5d3dc" stroke-width="1"/><text x="92" y="488" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#0A2540" text-anchor="start">INDEXING</text><text x="428" y="480" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="400" fill="#0A2540" text-anchor="start">Can the page</text><text x="428" y="516" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="400" fill="#0A2540" text-anchor="start">be indexed?</text><text x="788" y="480" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="400" fill="#0A2540" text-anchor="start">Review canonical</text><text x="788" y="516" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="400" fill="#0A2540" text-anchor="start">and robots.</text><text x="72" y="568" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" fill="#314b61" text-anchor="start">Source: Google Search Central.</text></svg>
