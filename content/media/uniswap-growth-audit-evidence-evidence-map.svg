<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><text x="64" y="78" font-family="Inter,Arial" font-size="52" font-weight="700" fill="#0A2540">Public evidence and data gaps</text><text x="64" y="122" font-family="Inter,Arial" font-size="39" fill="#354a5f">Activity cannot identify users.</text><rect x="70" y="180" width="490" height="340" rx="12" fill="#f3f8fc" stroke="#0A2540" stroke-width="3"/><rect x="640" y="180" width="490" height="340" rx="12" fill="#fff9e8" stroke="#0A2540" stroke-width="4"/><rect x="640" y="180" width="490" height="90" rx="12" fill="#FFB800" stroke="#0A2540" stroke-width="0"/><text x="110" y="235" font-family="Inter,Arial" font-size="29" font-weight="700" fill="#0A2540">Public evidence</text><text x="680" y="235" font-family="Inter,Arial" font-size="29" font-weight="700" fill="#0A2540">First-party data needed</text><g font-family="Inter,Arial" font-size="29" fill="#0A2540"><text x="110" y="295">• Product and developer docs</text><text x="110" y="350">• Governance proposals / votes</text><text x="110" y="405">• On-chain calls and fee events</text><text x="110" y="460">• Aggregate volume snapshots</text><text x="680" y="295">• Acquisition source per user</text><text x="680" y="350">• Wallet-to-person identity</text><text x="680" y="405">• Retention cohorts by channel</text><text x="680" y="460">• Incremental campaign impact</text></g><text x="70" y="585" font-family="Inter,Arial" font-size="22" fill="#354a5f">Sources: Uniswap docs and governance.</text><text x="70" y="625" font-family="Inter,Arial" font-size="22" fill="#354a5f">Concept diagram. It does not report user counts or performance results.</text></svg>
