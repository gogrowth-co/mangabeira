<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1180" viewBox="0 0 720 1180" role="img" aria-labelledby="title desc">
  <title id="title">Evidence to decision method</title><desc id="desc">A four-stage method moves vertically from source evidence to a decision.</desc>
  <rect width="720" height="1180" fill="#EAF6FA"/><style>.d{font-family:Montserrat,Arial,sans-serif;font-weight:800;fill:#0A2540}.b{font-family:Inter,Arial,sans-serif;fill:#607888}.l{font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:700;letter-spacing:2px;fill:#607888}.card{fill:#FFFFFF;stroke:#C8D5DE;stroke-width:2}.n{font-family:Montserrat,Arial,sans-serif;font-size:18px;font-weight:800;fill:#071829}.ct{font-family:Montserrat,Arial,sans-serif;font-size:22px;font-weight:800;fill:#0A2540}.cb{font-family:Inter,Arial,sans-serif;font-size:16px;fill:#607888}</style>
  <text class="l" x="48" y="58">METHOD DIAGRAM</text><text class="d" x="48" y="110" font-size="36"><tspan x="48">Evidence becomes</tspan><tspan x="48" dy="42">a decision.</tspan></text><text class="b" x="48" y="209" font-size="18">Four traceable stages keep the work honest.</text>
  <path d="M83 287V770" stroke="#0A2540" stroke-width="3"/>
  <g transform="translate(112 250)"><rect class="card" width="560" height="118" rx="8"/><circle cx="38" cy="38" r="18" fill="#1FB6FF"/><text class="n" x="33" y="44">1</text><text class="ct" x="75" y="42">Source</text><text class="cb" x="75" y="75">What is visible? Capture the original source.</text></g>
  <g transform="translate(112 385)"><rect class="card" width="560" height="118" rx="8"/><circle cx="38" cy="38" r="18" fill="#1FB6FF"/><text class="n" x="32" y="44">2</text><text class="ct" x="75" y="42">Observe</text><text class="cb" x="75" y="75">What does it reveal? Name only what is visible.</text></g>
  <g transform="translate(112 520)"><rect class="card" width="560" height="118" rx="8"/><circle cx="38" cy="38" r="18" fill="#1FB6FF"/><text class="n" x="32" y="44">3</text><text class="ct" x="75" y="42">Imply</text><text class="cb" x="75" y="75">Why does it matter across the growth system?</text></g>
  <g transform="translate(112 655)"><rect width="560" height="118" rx="8" fill="#0A2540"/><circle cx="38" cy="38" r="18" fill="#FFB800"/><text class="n" x="32" y="44">4</text><text x="75" y="42" font-family="Montserrat,Arial,sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Decide</text><text x="75" y="75" font-family="Inter,Arial,sans-serif" font-size="16" fill="#C8D5DE">What happens next? Set the correction and owner.</text></g>
  <rect x="48" y="840" width="624" height="150" rx="8" fill="#FFFFFF" stroke="#C8D5DE" stroke-width="2"/><rect x="48" y="840" width="10" height="150" fill="#FFB800"/><text class="d" x="84" y="888" font-size="20">Confidence travels with the finding.</text><text class="b" x="84" y="923" font-size="16"><tspan x="84">High, medium, or low, based on the</tspan><tspan x="84" dy="25">evidence available.</tspan></text>
</svg>
