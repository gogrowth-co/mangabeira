<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc">
  <title id="title">The six-surface Web3 growth audit system</title><desc id="desc">Six audit surfaces are connected to a visitor journey from discovery to advocacy.</desc>
  <rect width="720" height="1280" fill="#FFFFFF"/><style>.d{font-family:Montserrat,Arial,sans-serif;font-weight:800;fill:#0A2540}.b{font-family:Inter,Arial,sans-serif;fill:#607888}.l{font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:700;letter-spacing:2px;fill:#607888}.n{fill:#FFFFFF;stroke:#C8D5DE;stroke-width:2}.nt{font-family:Montserrat,Arial,sans-serif;font-size:24px;font-weight:800;fill:#0A2540}.nb{font-family:Inter,Arial,sans-serif;font-size:16px;fill:#607888}</style>
  <text class="l" x="48" y="62">METHOD DIAGRAM</text><text class="d" x="48" y="116" font-size="38"><tspan x="48">One system.</tspan><tspan x="48" dy="44">Six surfaces.</tspan></text><text class="b" x="48" y="225" font-size="18">The audit tests every handoff.</text>
  <path d="M92 313V900" stroke="#1FB6FF" stroke-width="4"/><path d="M81 890l11 17 11-17" fill="none" stroke="#1FB6FF" stroke-width="4"/>
  <g transform="translate(125 260)"><rect class="n" width="547" height="92" rx="8"/><rect width="10" height="92" fill="#1FB6FF"/><text class="nt" x="34" y="40">Website</text><text class="nb" x="34" y="69">Narrative, proof and conversion paths</text></g>
  <g transform="translate(125 370)"><rect class="n" width="547" height="92" rx="8"/><rect width="10" height="92" fill="#1FB6FF"/><text class="nt" x="34" y="40">dApp</text><text class="nb" x="34" y="69">Onboarding, action and return paths</text></g>
  <g transform="translate(125 480)"><rect class="n" width="547" height="92" rx="8"/><rect width="10" height="92" fill="#1FB6FF"/><text class="nt" x="34" y="40">Social Media</text><text class="nb" x="34" y="69">Narrative, publishing and downstream paths</text></g>
  <g transform="translate(125 590)"><rect class="n" width="547" height="92" rx="8"/><rect width="10" height="92" fill="#FFB800"/><text class="nt" x="34" y="40">Community</text><text class="nb" x="34" y="69">Welcome, activation and reactivation loops</text></g>
  <g transform="translate(125 700)"><rect class="n" width="547" height="92" rx="8"/><rect width="10" height="92" fill="#1FB6FF"/><text class="nt" x="34" y="40">SEO + answer visibility</text><text class="nb" x="34" y="69">Search discovery, citations and authority</text></g>
  <g transform="translate(125 810)"><rect class="n" width="547" height="92" rx="8"/><rect width="10" height="92" fill="#1FB6FF"/><text class="nt" x="34" y="40">PR + Paid Ads</text><text class="nb" x="34" y="69">Authority, message fit and attribution</text></g>
  <rect x="125" y="928" width="547" height="44" rx="6" fill="#0A2540"/><text x="398" y="956" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">ONE DIAGNOSIS · WHERE THE HANDOFF BREAKS</text>
  <rect x="48" y="984" width="624" height="238" rx="8" fill="#EAF6FA"/><text class="l" x="78" y="1028">THE USER JOURNEY</text><text class="b" x="78" y="1075" font-size="18" font-weight="700" fill="#0A2540">Discovery → Understanding → Trust</text><text class="b" x="78" y="1110" font-size="18" font-weight="700" fill="#0A2540">→ First action → Repeat use → Advocacy</text><text class="b" x="78" y="1165" font-size="17"><tspan x="78">Most breaks appear where one surface</tspan><tspan x="78" dy="26">hands intent to the next.</tspan></text>
</svg>
