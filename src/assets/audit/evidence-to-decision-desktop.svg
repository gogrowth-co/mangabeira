<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Evidence to decision method</title><desc id="desc">A four-stage method moves from source evidence to observation, implication, and decision.</desc>
  <rect width="1400" height="700" fill="#EAF6FA"/><style>.d{font-family:Montserrat,Arial,sans-serif;font-weight:800;fill:#0A2540}.b{font-family:Inter,Arial,sans-serif;fill:#607888}.l{font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:700;letter-spacing:2px;fill:#607888}.card{fill:#FFFFFF;stroke:#C8D5DE;stroke-width:2}.num{font-family:Montserrat,Arial,sans-serif;font-size:22px;font-weight:800;fill:#071829}.ct{font-family:Montserrat,Arial,sans-serif;font-size:22px;font-weight:800;fill:#0A2540}.cb{font-family:Inter,Arial,sans-serif;font-size:16px;fill:#607888}</style>
  <text class="l" x="70" y="70">METHOD DIAGRAM</text><text class="d" x="70" y="128" font-size="44">Evidence becomes a decision in four traceable stages.</text><text class="b" x="70" y="170" font-size="20">Facts stay separate from interpretation, so recommendations never float free of their source.</text>
  <path d="M165 355H1235" stroke="#0A2540" stroke-width="3"/><path d="M1225 344l16 11-16 11" fill="none" stroke="#0A2540" stroke-width="3"/>
  <g transform="translate(70 245)"><rect class="card" width="290" height="230" rx="8"/><circle cx="36" cy="36" r="19" fill="#1FB6FF"/><text class="num" x="30" y="44">1</text><text class="ct" x="25" y="91">Source</text><text class="cb" x="25" y="130"><tspan x="25">What is visible?</tspan><tspan x="25" dy="25">Capture the original source</tspan><tspan x="25" dy="25">without interpretation.</tspan></text></g>
  <g transform="translate(390 245)"><rect class="card" width="290" height="230" rx="8"/><circle cx="36" cy="36" r="19" fill="#1FB6FF"/><text class="num" x="29" y="44">2</text><text class="ct" x="25" y="91">Observe</text><text class="cb" x="25" y="130"><tspan x="25">What does it reveal?</tspan><tspan x="25" dy="25">Name what is directly visible</tspan><tspan x="25" dy="25">without inflating it.</tspan></text></g>
  <g transform="translate(710 245)"><rect class="card" width="290" height="230" rx="8"/><circle cx="36" cy="36" r="19" fill="#1FB6FF"/><text class="num" x="29" y="44">3</text><text class="ct" x="25" y="91">Imply</text><text class="cb" x="25" y="130"><tspan x="25">Why does it matter?</tspan><tspan x="25" dy="25">Connect the local issue to the</tspan><tspan x="25" dy="25">growth system.</tspan></text></g>
  <g transform="translate(1030 245)"><rect x="0" y="0" width="300" height="230" rx="8" fill="#0A2540"/><circle cx="36" cy="36" r="19" fill="#FFB800"/><text class="num" x="29" y="44">4</text><text x="25" y="91" font-family="Montserrat,Arial,sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Decide</text><text x="25" y="130" font-family="Inter,Arial,sans-serif" font-size="16" fill="#C8D5DE"><tspan x="25">What happens next?</tspan><tspan x="25" dy="25">Set the useful correction, owner,</tspan><tspan x="25" dy="25">and expected signal.</tspan></text></g>
  <rect x="70" y="530" width="1260" height="96" rx="8" fill="#FFFFFF" stroke="#C8D5DE" stroke-width="2"/><rect x="70" y="530" width="12" height="96" fill="#FFB800"/><text class="d" x="110" y="570" font-size="21">Confidence travels with the finding.</text><text class="b" x="110" y="600" font-size="17">High, medium, or low, based on the strength and completeness of the available evidence.</text>
</svg>
