<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Web3 Growth Audit delivery handoff</title><desc id="desc">Miro, Loom, a private GitHub repository, and Notion form one operating reference.</desc>
  <rect width="1400" height="700" fill="#FFFFFF"/><style>.d{font-family:Montserrat,Arial,sans-serif;font-weight:800;fill:#0A2540}.b{font-family:Inter,Arial,sans-serif;fill:#607888}.l{font-family:Inter,Arial,sans-serif;font-weight:700;letter-spacing:2px;fill:#607888}.ct{font-family:Montserrat,Arial,sans-serif;font-size:24px;font-weight:800;fill:#0A2540}.cb{font-family:Inter,Arial,sans-serif;font-size:16px;fill:#607888}</style>
  <text class="l" x="70" y="70" font-size="16">DELIVERY HANDOFF</text><text class="d" x="70" y="130" font-size="46">Four deliverables. One operating reference.</text><text class="b" x="70" y="172" font-size="20">Each format answers a different question, without fragmenting the work.</text>
  <path d="M195 355H1205" stroke="#1FB6FF" stroke-width="4"/><path d="M1195 344l16 11-16 11" fill="none" stroke="#1FB6FF" stroke-width="4"/>
  <g transform="translate(70 245)"><rect width="280" height="245" rx="8" fill="#EAF6FA"/><rect x="0" width="12" height="245" fill="#1FB6FF"/><text class="l" x="38" y="54" font-size="14">01</text><text class="ct" x="38" y="99">Miro</text><text class="cb" x="38" y="137"><tspan x="38">The complete visual</tspan><tspan x="38" dy="25">diagnosis and source</tspan><tspan x="38" dy="25">evidence.</tspan></text></g>
  <g transform="translate(390 245)"><rect width="280" height="245" rx="8" fill="#F5F7FA" stroke="#C8D5DE"/><rect x="0" width="12" height="245" fill="#1FB6FF"/><text class="l" x="38" y="54" font-size="14">02</text><text class="ct" x="38" y="99">Loom</text><text class="cb" x="38" y="137"><tspan x="38">A guided reading of</tspan><tspan x="38" dy="25">the evidence and</tspan><tspan x="38" dy="25">implications.</tspan></text></g>
  <g transform="translate(710 245)"><rect width="280" height="245" rx="8" fill="#F5F7FA" stroke="#C8D5DE"/><rect x="0" width="12" height="245" fill="#FFB800"/><text class="l" x="38" y="54" font-size="14">03</text><text class="ct" x="38" y="99">Private GitHub</text><text class="cb" x="38" y="137"><tspan x="38">The fixed, context-built</tspan><tspan x="38" dy="25">skill package your</tspan><tspan x="38" dy="25">team can clone.</tspan></text></g>
  <g transform="translate(1030 245)"><rect width="300" height="245" rx="8" fill="#0A2540"/><rect x="0" width="12" height="245" fill="#FFB800"/><text x="38" y="54" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#FFB800">04</text><text x="38" y="99" font-family="Montserrat,Arial,sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Notion report</text><text x="38" y="137" font-family="Inter,Arial,sans-serif" font-size="16" fill="#C8D5DE"><tspan x="38">The operating index</tspan><tspan x="38" dy="25">your team keeps and</tspan><tspan x="38" dy="25">uses.</tspan></text></g>
  <rect x="70" y="545" width="1260" height="92" rx="8" fill="#071829"/><text x="110" y="598" font-family="Montserrat,Arial,sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Evidence stays inspectable. Decisions stay usable.</text><text x="1040" y="598" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#1FB6FF">FULLY ASYNC</text>
</svg>
